# Publishes a static snapshot of the public site on GitHub Pages
# (https://<owner>.github.io/<repo>/). Runs only while the repository is
# public: Settings -> Pages -> Source: "GitHub Actions", then Actions ->
# "Pubblica su GitHub Pages" -> Run workflow (later pushes publish by themselves).
# No admin panel on Pages: products/events are frozen at each publish.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /${{ github.event.repository.name }}
      PAGES_SITE: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/export-static.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
